name: Tests & Coverage

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.11'
  DATABASE_URL: 'sqlite:///:memory:'
  ENVIRONMENT: 'testing'

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          ES_JAVA_OPTS: '-Xms512m -Xmx512m'
        options: >-
          --health-cmd "curl -f http://localhost:9200 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 9200:9200

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt
        pip install -r tests/requirements-dev.txt coverage
    
    - name: Lint with flake8
      working-directory: ./backend
      continue-on-error: true
      run: |
        pip install flake8
        flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Run unit tests
      working-directory: ./backend
      env:
        ELASTICSEARCH_HOST: localhost
        REDIS_URL: 'redis://localhost:6379'
        DATABASE_URL: ${{ env.DATABASE_URL }}
      run: |
        pytest tests/unit/ -v --cov=app --cov-report=xml --cov-report=html --cov-report=term-missing
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./backend/coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        verbose: true
    
    - name: Archive coverage reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: coverage-report
        path: backend/htmlcov/
        retention-days: 30
    
    - name: Integration tests
      working-directory: ./backend
      continue-on-error: true
      env:
        ELASTICSEARCH_HOST: localhost
        REDIS_URL: 'redis://localhost:6379'
        DATABASE_URL: ${{ env.DATABASE_URL }}
      run: |
        pytest tests/integration/ -v --tb=short
    
    - name: OAI-PMH validation (quick)
      working-directory: ./backend
      continue-on-error: true
      timeout-minutes: 10
      run: |
        pip install requests lxml
        python -c "
        import timeout_decorator
        from app.extractors.oai_pmh import OAIPMHExtractor
        
        urls = [
          ('https://journals-sol.sbc.org.br/index.php/rbie/oai', 'RBIE'),
        ]
        
        for url, name in urls:
          try:
            extractor = OAIPMHExtractor(url, timeout=30)
            result = extractor.validate_repository()
            print(f'{name}: {\"PASS\" if result else \"FAIL\"}')
          except Exception as e:
            print(f'{name}: ERROR - {e}')
        "
    
    - name: Generate test summary
      if: always()
      run: |
        echo "## Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ All automated tests completed" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Coverage Target: 80%" >> $GITHUB_STEP_SUMMARY
        echo "Progress: See coverage report artifact" >> $GITHUB_STEP_SUMMARY

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Run Bandit security analysis
      continue-on-error: true
      working-directory: ./backend
      run: |
        pip install bandit
        bandit -r app/ -ll || true
    
    - name: Check Dockerfile vulnerabilities
      working-directory: ./backend
      run: |
        echo "Checking Python base image..."
        grep "FROM python" Dockerfile || echo "No Python base image found"
