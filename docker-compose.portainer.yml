version: "3.8"

services:

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default
    deploy:
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - default
    deploy:
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M

  backend:
    image: ghcr.io/mateusamarodasilva/base-brasileira-em-ciencia-da-computacao:main
    entrypoint: ["/bin/sh", "/app/entrypoint.sh"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ELASTICSEARCH_HOST: localhost
      ELASTICSEARCH_PORT: "9200"
      ENVIRONMENT: production
      DEBUG: "false"
    networks:
      - default
    deploy:
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  celery_worker:
    image: ghcr.io/mateusamarodasilva/base-brasileira-em-ciencia-da-computacao:main
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ELASTICSEARCH_HOST: localhost
      ELASTICSEARCH_PORT: "9200"
      ENVIRONMENT: production
    networks:
      - default
    deploy:
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  frontend:
    image: ghcr.io/mateusamarodasilva/base-brasileira-em-ciencia-da-computacao-frontend:main
    networks:
      - default
      - ingress-network
    deploy:
      restart_policy:
        condition: any
      labels:
        caddy: ${DOMAIN}
        caddy.reverse_proxy: "{{upstreams 80}}"
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M

volumes:
  postgres_data:
  redis_data:

networks:
  default:
  ingress-network:
    external: true
