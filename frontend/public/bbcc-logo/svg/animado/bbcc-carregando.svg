<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120.0 120.0" width="120" height="120" role="img" aria-label="Carregando…"><title>Carregando…</title><style>
.bbcc-ring{transform-box:fill-box;transform-origin:50% 50%;animation:bbcc-spin 10s linear infinite}
.bbcc-ln{stroke-dasharray:18 18;animation:bbcc-flow 2.8s ease-in-out infinite both}
.bbcc-nd{transform-box:fill-box;transform-origin:50% 50%;animation:bbcc-pop 2.8s ease-out infinite both}
.bbcc-d1{animation-delay:0s}.bbcc-d2{animation-delay:.15s}.bbcc-d3{animation-delay:.3s}.bbcc-d4{animation-delay:.45s}.bbcc-d5{animation-delay:.6s}.bbcc-d6{animation-delay:.75s}
.bbcc-sp{transform-box:fill-box;transform-origin:50% 100%;animation:bbcc-grow 2.8s cubic-bezier(.3,.7,.3,1) infinite both}
.bbcc-s1{animation-delay:.9s}.bbcc-s2{animation-delay:1.05s}.bbcc-s3{animation-delay:1.2s}.bbcc-s4{animation-delay:1.35s}
.bbcc-lean{transform-box:fill-box;transform-origin:100% 100%;animation:bbcc-lean 2.8s ease-in-out 1.35s infinite both}
.bbcc-lbl{animation:bbcc-fade 1.4s ease-in-out infinite alternate}
@keyframes bbcc-spin{to{transform:rotate(360deg)}}
@keyframes bbcc-flow{0%{stroke-dashoffset:18}10%{stroke-dashoffset:0}70%{stroke-dashoffset:0}85%,100%{stroke-dashoffset:-18}}
@keyframes bbcc-pop{0%{transform:scale(1)}5%{transform:scale(1.4)}12%,100%{transform:scale(1)}}
@keyframes bbcc-grow{0%{transform:scaleY(0)}10%{transform:scaleY(1.08)}14%{transform:scaleY(1)}58%{transform:scaleY(1)}68%,100%{transform:scaleY(0)}}
@keyframes bbcc-lean{0%,12%{transform:rotate(0deg)}22%{transform:rotate(15deg)}27%{transform:rotate(12deg)}55%{transform:rotate(12deg)}64%,100%{transform:rotate(0deg)}}
@keyframes bbcc-fade{from{opacity:.45}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.bbcc-ring,.bbcc-ln,.bbcc-nd,.bbcc-sp,.bbcc-lbl{animation:none}.bbcc-ln{stroke-dasharray:none}.bbcc-lean{animation:none;transform:rotate(12deg)}}
</style>
